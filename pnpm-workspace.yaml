packages:
  - apps/*
  - packages/*

nodeLinker: hoisted
trustLockfile: true

overrides:
  '@expo/dom-webview': 56.0.5
  '@typescript-eslint/eslint-plugin': 8.62.0
  '@typescript-eslint/parser': 8.62.0
  '@typescript-eslint/project-service': 8.62.0
  '@typescript-eslint/scope-manager': 8.62.0
  '@typescript-eslint/tsconfig-utils': 8.62.0
  '@typescript-eslint/type-utils': 8.62.0
  '@typescript-eslint/types': 8.62.0
  '@typescript-eslint/typescript-estree': 8.62.0
  '@typescript-eslint/utils': 8.62.0
  '@typescript-eslint/visitor-keys': 8.62.0
  inflight: ^1.0.6
  typescript-eslint: 8.62.0

peerDependencyRules:
  allowedVersions:
    audio-decode: 3.11.0
    link-preview-js: 4.0.4
    typescript: 6.0.3
    react-native-worklets: 0.10.0
    eslint: 10.6.0
    '@typescript-eslint/eslint-plugin': 8.62.0
    video.js: 8.23.9
    vue-eslint-parser: 9.4.3
    stylelint: 17.14.0
    vue-router: 5.1.0
    vite: 8.1.0

patchedDependencies:
  expo-file-system@56.0.8: patches/expo-file-system@56.0.8.patch
  expo-image-picker@56.0.18: patches/expo-image-picker@56.0.18.patch

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  '@whiskeysockets/baileys@https://gitea.devunder.com/underchat/-/packages/npm/@whiskeysockets%2Fbaileys/1.0.1/files/236': true
  '@whiskeysockets/baileys@https://gitea.devunder.com/underchat/-/packages/npm/@whiskeysockets%2Fbaileys/1.0.1/files/237': true
  '@wwebjs/whatsapp-web.js@https://gitea.devunder.com/underchat/-/packages/npm/@wwebjs%2Fwhatsapp-web.js/1.34.8/files/238': true
  core-js: true
  cpu-features: true
  dtrace-provider: true
  electron: true
  electron-winstaller: true
  esbuild: true
  msw: true
  node-rdkafka: true
  protobufjs: true
  puppeteer: true
  sonar-scanner: true
  ssh2: true
  unrs-resolver: true
  vue-demi: true

minimumReleaseAgeExclude:
  - '@cacheable/memory@2.2.0'
  - '@cacheable/utils@2.5.0'
  - '@cyberalien/svg-utils@1.2.16'
  - bare-os@3.9.2
  - cacheable@2.5.0
  - electron-to-chromium@1.5.380
  - eslint@10.6.0
  - file-entry-cache@11.1.5
  - flat-cache@6.1.23
  - js-yaml@3.15.0 || 4.3.0
  - prettier@3.9.0
  - swiper@14.0.0
  - tar-fs@2.1.5 || 3.1.3
