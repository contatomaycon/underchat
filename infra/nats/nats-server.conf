# Local-only three-node JetStream configuration. Production configuration is
# owned by underchat-argocd and must not reuse these development credentials.
host: 0.0.0.0
port: 4222
http_port: 8222

jetstream {
  store_dir: /data/jetstream
  max_memory_store: 256MiB
  max_file_store: 16GiB
  request_queue_limit: 2000
  limits {
    # Three R3 streams, one R3 KV bucket and up to 2,000 R3 consumers.
    max_ha_assets: 4096
  }
}

cluster {
  name: UC_LOCAL
  host: 0.0.0.0
  port: 6222
  authorization {
    user: $NATS_ROUTE_USER
    password: $NATS_ROUTE_PASSWORD
    timeout: 2
  }
}

accounts {
  SYS {
    users: [
      {
        user: $NATS_SYSTEM_USER
        password: $NATS_SYSTEM_PASSWORD
      }
    ]
  }

  UNDERCHAT {
    jetstream {
      max_memory: 256MiB
      # Account reservation includes the bounded commands/failures/KV and the
      # five-minute deferred scheduler. Account exhaustion rejects publishing;
      # it must never evict an already accepted deferred command.
      max_store: 32GiB
      max_streams: 8
      max_consumers: 2000
    }

    users: [
      {
        # Bootstrap/inspection principal used only by under-nats-init locally.
        user: $NATS_ADMIN_USER
        password: $NATS_ADMIN_PASSWORD
      }
      {
        # Runtime principal. Destructive JetStream APIs are explicitly denied.
        user: $NATS_USER
        password: $NATS_PASSWORD
        permissions: {
          publish: {
            allow: [
              "uc.worker.command.*"
              "uc.worker.failure.*"
              "uc.worker.deferred.schedule.>"
              "uc.worker.deferred.ready.*"
              "$KV.UC_WORKER_EPOCH_V1.>"
              "$JS.ACK.>"

              # Runtime may inspect only the four declared resources. It cannot
              # create, update, delete, purge or seal a stream/KV bucket.
              "$JS.API.INFO"
              "$JS.API.STREAM.INFO.UC_WORKER_COMMANDS_V1"
              "$JS.API.STREAM.INFO.UC_WORKER_FAILURES_V1"
              "$JS.API.STREAM.INFO.UC_WORKER_DEFERRED_V1"
              "$JS.API.STREAM.INFO.KV_UC_WORKER_EPOCH_V1"
              "$JS.API.STREAM.MSG.GET.KV_UC_WORKER_EPOCH_V1"

              # Both current NATS KV clients use the optimized direct-get API
              # for KV.Get(). The final subject is deliberately restricted to
              # the worker epoch key shape; omitting this permission leaves the
              # WhatsApp provider connected but prevents command-ingress
              # readiness from ever becoming true.
              "$JS.API.DIRECT.GET.KV_UC_WORKER_EPOCH_V1.$KV.UC_WORKER_EPOCH_V1.worker.*"

              # Channel runtimes create/rebind their exact durable command
              # consumer. KV watches use short-lived consumers on the epoch
              # bucket; only those ephemeral KV consumers may be deleted.
              "$JS.API.CONSUMER.CREATE.UC_WORKER_COMMANDS_V1"
              "$JS.API.CONSUMER.CREATE.UC_WORKER_COMMANDS_V1.>"
              "$JS.API.CONSUMER.DURABLE.CREATE.UC_WORKER_COMMANDS_V1.>"
              "$JS.API.CONSUMER.INFO.UC_WORKER_COMMANDS_V1.>"
              "$JS.API.CONSUMER.MSG.NEXT.UC_WORKER_COMMANDS_V1.>"
              "$JS.API.CONSUMER.CREATE.KV_UC_WORKER_EPOCH_V1"
              "$JS.API.CONSUMER.CREATE.KV_UC_WORKER_EPOCH_V1.>"
              "$JS.API.CONSUMER.DURABLE.CREATE.KV_UC_WORKER_EPOCH_V1.>"
              "$JS.API.CONSUMER.INFO.KV_UC_WORKER_EPOCH_V1.>"
              "$JS.API.CONSUMER.DELETE.KV_UC_WORKER_EPOCH_V1.>"
            ]
            deny: [
              "$JS.API.STREAM.CREATE.>"
              "$JS.API.STREAM.UPDATE.>"
              "$JS.API.STREAM.DELETE.>"
              "$JS.API.STREAM.PURGE.>"
              "$JS.API.STREAM.MSG.DELETE.>"
              "$JS.API.STREAM.RESTORE.>"
              "$JS.API.STREAM.SNAPSHOT.>"
              "$JS.API.CONSUMER.DELETE.UC_WORKER_COMMANDS_V1.>"
            ]
          }
          subscribe: {
            allow: [
              "_INBOX.>"
              "uc.worker.command.*"
              "uc.worker.failure.*"
            ]
          }
        }
      }
    ]
  }
}

system_account: SYS

write_deadline: 5s
# The persisted command envelope remains capped at 64 KiB by the stream.
# Leave wire headroom for NATS/JetStream headers and protocol framing.
max_payload: 80KiB
max_pending: 64MiB
ping_interval: 30s
ping_max: 3
lame_duck_duration: 30s
lame_duck_grace_period: 10s
