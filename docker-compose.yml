services:
  under-db:
    image: postgres:latest
    container_name: under-db
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=underchat
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10
    ports:
      - 5432:5432
    networks:
      - underchat
    restart: always
    volumes:
      - db_postgresql:/var/lib/postgresql

  under-db-elastic:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.0.1
    container_name: under-db-elastic-clean
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - 'ES_JAVA_OPTS=-Xms512m -Xmx512m'
      - xpack.security.enabled=true
      - cluster.routing.allocation.disk.threshold_enabled=false
      - ELASTIC_PASSWORD=admin
      - cluster.name=es-cluster
      - node.name=es-node
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - db_elastic_data_clean:/usr/share/elasticsearch/data
    ports:
      - '9201:9200'
    networks:
      - underchat
    restart: always

  under-redis:
    container_name: under-redis
    image: redis:7.2.4
    command: redis-server --requirepass dY5MRW2^!jxHX
    ports:
      - 6379:6379
    restart: always
    networks:
      - underchat

  under-elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.0.1
    container_name: under-elasticsearch-clean
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - 'ES_JAVA_OPTS=-Xms1g -Xmx1g'
      - xpack.security.enabled=true
      - cluster.routing.allocation.disk.threshold_enabled=false
      - ELASTIC_PASSWORD=admin
      - cluster.name=es-cluster
      - node.name=es-node
      # Roles explícitos de tier — necessário para ILM com hot/warm/cold em single-node
      - node.roles=master,data,data_content,data_hot,data_warm,data_cold,ingest,remote_cluster_client
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - elasticsearch_data_clean:/usr/share/elasticsearch/data
    ports:
      - '9200:9200'
    networks:
      - underchat
    restart: always
    healthcheck:
      test:
        - CMD-SHELL
        - 'curl -sf -u elastic:admin http://localhost:9200/_cluster/health | grep -qE "\"status\":\"(green|yellow)\""'
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  under-elasticsearch-setup:
    image: curlimages/curl:8.12.1
    container_name: under-elasticsearch-setup
    networks:
      - underchat
    depends_on:
      under-elasticsearch:
        condition: service_healthy
    restart: on-failure
    command:
      - sh
      - -ec
      - |
        ES="http://elastic:admin@under-elasticsearch-clean:9200"

        # ── ILM policy ──────────────────────────────────────────────────────────
        # Rollover em 1 GB (dev) ou 1 dia — mesma estrutura hot→warm→cold→delete
        # do cluster de prod; apenas max_primary_shard_size reduzido para 1 GB.
        curl -sf -X PUT "$ES/_ilm/policy/underchat-hot-warm-cold-180d" \
          -H 'Content-Type: application/json' -d '{
            "policy": {
              "phases": {
                "hot":  { "min_age": "0ms",  "actions": { "set_priority": {"priority": 100}, "rollover": {"max_primary_shard_size": "1gb", "max_age": "1d"} } },
                "warm": { "min_age": "30d",  "actions": { "set_priority": {"priority": 50},  "forcemerge": {"max_num_segments": 1} } },
                "cold": { "min_age": "75d",  "actions": { "set_priority": {"priority": 25} } },
                "delete": { "min_age": "180d", "actions": { "delete": {} } }
              }
            }
          }'

        # ── Index templates com rollover ────────────────────────────────────────
        for tmpl_data in \
          'underchat-chat-rollover-template|["chat-*"]|chat-write' \
          'underchat-message-rollover-template|["message-*"]|message-write' \
          'underchat-wpp-connection-rollover-template|["wpp-connection-*"]|wpp-connection-write'; do
          name=$(echo "$tmpl_data" | cut -d'|' -f1)
          patterns=$(echo "$tmpl_data" | cut -d'|' -f2)
          alias=$(echo "$tmpl_data" | cut -d'|' -f3)
          curl -sf -X PUT "$ES/_index_template/$name" \
            -H 'Content-Type: application/json' -d "{
              \"index_patterns\": $patterns,
              \"priority\": 300,
              \"template\": {
                \"settings\": {
                  \"index.lifecycle.name\": \"underchat-hot-warm-cold-180d\",
                  \"index.lifecycle.rollover_alias\": \"$alias\",
                  \"number_of_replicas\": 0,
                  \"routing.allocation.include._tier_preference\": \"data_hot,data_warm,data_cold\"
                }
              }
            }"
          echo "Template $name OK"
        done

        # ── Template hot-only (sem ILM) ─────────────────────────────────────────
        curl -sf -X PUT "$ES/_index_template/underchat-hot-only-template" \
          -H 'Content-Type: application/json' -d '{
            "index_patterns": ["ai-agent-prompt-embedding","chat-history-embedding","chatbot-flow","chatbot-flow-configurations","webhook","webhook-mapping"],
            "priority": 250,
            "template": {
              "settings": {
                "number_of_replicas": 0,
                "routing.allocation.include._tier_preference": "data_hot,data_content"
              }
            }
          }'

        # ── Rollover bootstrap ──────────────────────────────────────────────────
        ensure_rollover_bootstrap() {
          base="$1"
          alias_code=$(curl -sf -o /dev/null -w "%{http_code}" "$ES/_alias/${base}-write")
          if [ "$alias_code" = "200" ]; then
            echo "Alias ${base}-write already exists, skipping."
            return 0
          fi
          idx_code=$(curl -sf -o /dev/null -w "%{http_code}" "$ES/${base}-000001")
          if [ "$idx_code" = "200" ]; then
            echo "Index ${base}-000001 exists, adding aliases."
            curl -sf -X POST "$ES/_aliases" -H 'Content-Type: application/json' \
              -d "{\"actions\":[
                {\"add\":{\"index\":\"${base}-000001\",\"alias\":\"${base}-write\",\"is_write_index\":true}},
                {\"add\":{\"index\":\"${base}-000001\",\"alias\":\"${base}-read\"}}
              ]}"
            return 0
          fi
          echo "Creating bootstrap index ${base}-000001."
          curl -sf -X PUT "$ES/${base}-000001" -H 'Content-Type: application/json' \
            -d "{\"aliases\":{\"${base}-write\":{\"is_write_index\":true},\"${base}-read\":{}}}"
        }

        # ── Bare index pré-rollover → read alias (dados históricos) ────────────
        ensure_bare_in_read_alias() {
          base="$1"
          bare_code=$(curl -sf -o /dev/null -w "%{http_code}" "$ES/${base}")
          [ "$bare_code" != "200" ] && return 0
          already=$(curl -sf -o /dev/null -w "%{http_code}" "$ES/${base}/_alias/${base}-read")
          [ "$already" = "200" ] && { echo "Bare ${base} already in ${base}-read, skipping."; return 0; }
          echo "Adding bare index ${base} to ${base}-read alias."
          curl -sf -X POST "$ES/_aliases" -H 'Content-Type: application/json' \
            -d "{\"actions\":[{\"add\":{\"index\":\"${base}\",\"alias\":\"${base}-read\"}}]}"
        }

        ensure_rollover_bootstrap chat
        ensure_rollover_bootstrap message
        ensure_rollover_bootstrap wpp-connection

        ensure_bare_in_read_alias chat
        ensure_bare_in_read_alias message
        ensure_bare_in_read_alias wpp-connection

        echo "Elasticsearch setup complete."

  under-atlas-db:
    image: postgres:latest
    container_name: under-atlas-db
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=dev
    networks:
      - underchat
    restart: always
    volumes:
      - atlas_db_postgresql:/var/lib/postgresql

  under-atlas:
    build:
      context: .
      dockerfile: ./infra/atlas/dev/Dockerfile
    container_name: under-atlas
    user: '1000:1000'
    env_file:
      - .env
    networks:
      - underchat
    depends_on:
      - under-db
      - under-atlas-db
    volumes:
      - ./:/app

  under-kafka-1:
    image: apache/kafka:4.0.1
    container_name: under-kafka-1
    ports:
      - '9092:9092'
      - '29092:29092'
    environment:
      CLUSTER_ID: '4L6g3nShT-eMCtK--X86sw'
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENERS: 'PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://under-kafka-1:9092,EXTERNAL://10.0.2.89:29092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@under-kafka-1:9093,2@under-kafka-2:9093,3@under-kafka-3:9093'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
    networks:
      - underchat
    volumes:
      - kafka_data_1:/var/lib/kafka/data
    restart: always
    healthcheck:
      test:
        [
          'CMD',
          'bash',
          '-lc',
          'kafka-topics.sh --bootstrap-server 10.0.2.89:9092 --list >/dev/null 2>&1',
        ]
      interval: 15s
      timeout: 5s
      retries: 10

  under-kafka-2:
    image: apache/kafka:4.0.1
    container_name: under-kafka-2
    ports:
      - '9093:9092'
      - '29093:29092'
    environment:
      CLUSTER_ID: '4L6g3nShT-eMCtK--X86sw'
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENERS: 'PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://under-kafka-2:9092,EXTERNAL://10.0.2.89:29093'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@under-kafka-1:9093,2@under-kafka-2:9093,3@under-kafka-3:9093'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
    networks:
      - underchat
    volumes:
      - kafka_data_2:/var/lib/kafka/data
    restart: always
    healthcheck:
      test:
        [
          'CMD',
          'bash',
          '-lc',
          'kafka-topics.sh --bootstrap-server 10.0.2.89:9092 --list >/dev/null 2>&1',
        ]
      interval: 15s
      timeout: 5s
      retries: 10

  under-kafka-3:
    image: apache/kafka:4.0.1
    container_name: under-kafka-3
    ports:
      - '9094:9092'
      - '29094:29092'
    environment:
      CLUSTER_ID: '4L6g3nShT-eMCtK--X86sw'
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENERS: 'PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://under-kafka-3:9092,EXTERNAL://10.0.2.89:29094'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@under-kafka-1:9093,2@under-kafka-2:9093,3@under-kafka-3:9093'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
    networks:
      - underchat
    volumes:
      - kafka_data_3:/var/lib/kafka/data
    restart: always
    healthcheck:
      test:
        [
          'CMD',
          'bash',
          '-lc',
          'kafka-topics.sh --bootstrap-server 10.0.2.89:9092 --list >/dev/null 2>&1',
        ]
      interval: 15s
      timeout: 5s
      retries: 10

  under-kafdrop:
    image: obsidiandynamics/kafdrop:latest
    container_name: under-kafdrop
    ports:
      - '9000:9000'
    environment:
      - KAFKA_BROKERCONNECT=under-kafka-1:9092,under-kafka-2:9092,under-kafka-3:9092
      - JVM_OPTS=-Xms32M -Xmx64M
    depends_on:
      - under-kafka-1
      - under-kafka-2
      - under-kafka-3
    networks:
      - underchat
    restart: always

  under-centrifugo:
    image: centrifugo/centrifugo:latest
    container_name: under-centrifugo
    restart: unless-stopped
    ports:
      - '8000:8000'
    volumes:
      - ./infra/centrifugo/config.json:/etc/centrifugo/config.json:ro
    entrypoint: ['centrifugo']
    command: ['--config', '/etc/centrifugo/config.json']
    networks:
      - underchat

  under-minio:
    image: minio/minio:latest
    container_name: under-minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=adminadmin
    ports:
      - '9002:9000'
      - '9003:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://10.0.2.89:9002/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - underchat

  under-minio-setup:
    image: minio/mc:latest
    container_name: under-minio-setup
    depends_on:
      under-minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://under-minio:9000 admin adminadmin && \
      mc anonymous set download local/under-storage && \
      mc mb -p local/under-storage || true && \
      mc admin info local
      "
    networks:
      - underchat
    restart: 'no'

networks:
  underchat:

volumes:
  postgresql:
  postgresql_data:
  db_postgresql:
  db_elastic_data_clean:
  atlas_db_postgresql:
  elasticsearch_data_clean:
  kafka_data_1:
  kafka_data_2:
  kafka_data_3:
  minio_data:
