appId: br.com.underchat.authenticator
productName: Underchat Authenticator
copyright: Copyright (c) 2026 Underchat

asar: true
icon: build/icons/icon.png
npmRebuild: false
nodeGypRebuild: false
afterPack: scripts/after-pack.cjs

directories:
  output: release

files:
  - dist/**
  - package.json

extraMetadata:
  main: dist/main/index.js

protocols:
  - name: Underchat Authenticator
    schemes:
      - underchat-authenticator

mac:
  category: public.app-category.utilities
  icon: build/icons/icon.icns
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  notarize: true
  target:
    - target: dmg
      arch:
        - universal
    - target: zip
      arch:
        - universal
  artifactName: Underchat-Authenticator-${version}-${arch}.${ext}

win:
  icon: build/icons/icon.ico
  signAndEditExecutable: true
  signtoolOptions:
    sign: ./scripts/windows-sign-hook.cjs
    publisherName:
      - Underchat
    signingHashAlgorithms:
      - sha256
  target:
    - target: nsis
      arch:
        - x64
  artifactName: Underchat-Authenticator-${version}-${arch}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false

linux:
  category: Network
  executableName: underchat-authenticator
  icon: build/icons/icon.png
  maintainer: Underchat <contato@underchat.com.br>
  syncDesktopName: true
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  artifactName: Underchat-Authenticator-${version}-${arch}.${ext}
