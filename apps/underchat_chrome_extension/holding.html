<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Underchat — transferindo sessão</title>
    <link rel="stylesheet" href="/src/holding.css" />
  </head>
  <body>
    <main class="holding-shell">
      <img
        class="holding-logo"
        src="/src/assets/underchat-logo.svg"
        alt="Underchat"
      />
      <p class="holding-eyebrow">Underchat</p>
      <h1>Transferindo sua sessão</h1>
      <p class="holding-message">
        Esta aba foi pausada para evitar duas conexões simultâneas do WhatsApp.
        Mantenha-a aberta; a extensão vai restaurá-la automaticamente.
      </p>
      <div class="holding-progress" aria-label="Transferência em andamento">
        <span></span><span></span><span></span>
      </div>
    </main>
  </body>
</html>
