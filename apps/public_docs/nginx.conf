worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  access_log /dev/stdout;
  sendfile on;
  keepalive_timeout 65;
  server_tokens off;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml application/xml+rss image/svg+xml;

  map $uri $underchat_cache_control {
    default "no-cache";
    "~*^/assets/.+\.[a-z0-9_-]{8,}(?:\.[a-z0-9_-]+)*\.(?:css|js|mjs|svg|png|jpg|jpeg|gif|webp|ico|woff|woff2|ttf)$" "public, max-age=31536000, immutable";
    ~*\.(?:css|js|mjs|svg|png|jpg|jpeg|gif|webp|ico|woff|woff2|ttf)$ "public, max-age=3600, must-revalidate";
  }

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cache-Control $underchat_cache_control always;

    location = /index.html {
      try_files $uri =404;
    }

    location ~* \.(?:css|js|mjs|svg|png|jpg|jpeg|gif|webp|ico|woff|woff2|ttf)$ {
      try_files $uri =404;
    }

    location / {
      try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
  }
}
