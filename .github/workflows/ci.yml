name: Test and Quality Check

on:
  pull_request:
    branches: [dev, main]

env:
  SHARED_USER_TOKEN: ${{ vars.SHARED_USER_TOKEN }}
  SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
  SONAR_TOKEN_BACKEND: ${{ vars.SONAR_TOKEN_BACKEND }}
  SONAR_BACKEND_PROJECT_KEY: ${{ vars.SONAR_BACKEND_PROJECT_KEY }}
  TIME_AWAIT: 30
  VERSION_NODE: 22.18.0
  VERSION_JAVA: 17

jobs:
  build_backend:
    environment: 'Under Dev'
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.VERSION_NODE }}

      - name: Setup pnpm/yarn caches
        shell: bash
        run: |
          mkdir -p /root/.pnpm-store /root/.yarn-cache /tmp/pnpm-tmp
          echo "TMPDIR=/tmp/pnpm-tmp" >> $GITHUB_ENV
          echo "YARN_CACHE_FOLDER=/root/.yarn-cache" >> $GITHUB_ENV

          corepack enable
          corepack prepare pnpm@10.14.0 --activate
          corepack prepare yarn@4.9.2 --activate

          pnpm config set store-dir /root/.pnpm-store
          pnpm config set verify-store-integrity false

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.VERSION_JAVA }}
          distribution: 'temurin'

      - name: Install JQ
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Configure npm registry (Gitea Packages)
        run: |
          cat > ~/.npmrc << 'EOF'
          @underchat:registry=https://gitea.devunder.com/api/packages/underchat/npm/
          //gitea.devunder.com/api/packages/underchat/npm/:_authToken=${{ secrets.NPM_TOKEN }}
          EOF

      - name: Install Dependencies
        run: pnpm install

      - name: Run Lint
        run: pnpm run lint

      - name: Run Build
        run: pnpm run build

      - name: Get Changed Files
        id: changed_files
        run: |
          BASE_BRANCH="${{ github.base_ref }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          BASE_SHA="${{ github.event.pull_request.base.sha }}"

          if [[ -n "$BASE_SHA" ]] && [[ -n "$HEAD_SHA" ]]; then
            echo "Comparing $BASE_SHA..$HEAD_SHA"
            CHANGED_FILES=$(git diff --name-only ${BASE_SHA}..${HEAD_SHA} | grep -E '\.(ts|tsx|js|jsx|vue)$' | grep -v '\.spec\.' | grep -v 'node_modules' || true)
          elif [[ -n "$BASE_BRANCH" ]]; then
            echo "Comparing origin/${BASE_BRANCH}..HEAD"
            git fetch origin ${BASE_BRANCH} || true
            CHANGED_FILES=$(git diff --name-only origin/${BASE_BRANCH}...HEAD | grep -E '\.(ts|tsx|js|jsx|vue)$' | grep -v '\.spec\.' | grep -v 'node_modules' || true)
          else
            echo "Comparing HEAD~1..HEAD"
            CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD | grep -E '\.(ts|tsx|js|jsx|vue)$' | grep -v '\.spec\.' | grep -v 'node_modules' || true)
          fi

          if [[ -z "$CHANGED_FILES" ]]; then
            echo "No changed files found, analyzing all files"
            echo "sonar_inclusions=" >> $GITHUB_OUTPUT
          else
            INCLUSIONS=$(echo "$CHANGED_FILES" | tr '\n' ',' | sed 's/,$//')
            echo "Changed files:"
            echo "$CHANGED_FILES"
            echo "sonar_inclusions=$INCLUSIONS" >> $GITHUB_OUTPUT
          fi

      - name: SonarQube Scan
        id: sonar_scan
        uses: SonarSource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN_BACKEND }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}
        with:
          projectBaseDir: .
          args: >
            -Dsonar.projectKey=${{ env.SONAR_BACKEND_PROJECT_KEY }}
            -Dsonar.exclusions=**/node_modules/**,**/*.spec.ts,**/**/Dockerfile
            -Dsonar.coverage.exclusions=**
            -Dsonar.cpd.exclusions=**
            -Dsonar.branch.name=${{ github.head_ref }}
            -Dsonar.scanner.force-deprecated-java-version=true
            ${{ steps.changed_files.outputs.sonar_inclusions != '' && format('-Dsonar.inclusions={0}', steps.changed_files.outputs.sonar_inclusions) || '' }}

      - name: Wait for analysis processing
        run: |
          echo "⏳ Waiting ${TIME_AWAIT}s for SonarQube to process the analysis..."
          sleep ${{ env.TIME_AWAIT }}

      - name: Verify Branch Analysis and Get Correct URL
        id: verify_branch
        run: |
          set -e
          ENCODED_TOKEN=$(echo -n '${{ env.SHARED_USER_TOKEN }}:' | base64)
          PR_NUMBER="${{ github.event.pull_request.number }}"
          BRANCH_NAME="${{ github.head_ref }}"
          PROJECT_KEY="${{ env.SONAR_BACKEND_PROJECT_KEY }}"
          SONAR_URL="${{ env.SONAR_HOST_URL }}"

          echo "🔍 Verifying if branch analysis exists..."

          MAX_ATTEMPTS=12
          ATTEMPT=0
          BRANCH_AVAILABLE=false

          if [[ -n "$BRANCH_NAME" ]]; then
            while [[ $ATTEMPT -lt $MAX_ATTEMPTS ]]; do
              ATTEMPT=$((ATTEMPT + 1))
              
              BRANCH_API_URL="${SONAR_URL}api/qualitygates/project_status?projectKey=${PROJECT_KEY}&branch=${BRANCH_NAME}"
              response=$(wget --header="Authorization: Basic $ENCODED_TOKEN" -q -O - "$BRANCH_API_URL" 2>&1 || echo '')
              
              if echo "$response" | jq -e '.projectStatus' > /dev/null 2>&1; then
                echo "✅ Branch analysis found!"
                ANALYSIS_URL="${SONAR_URL}dashboard?id=${PROJECT_KEY}&branch=${BRANCH_NAME}"
                echo "analysis_url=$ANALYSIS_URL" >> $GITHUB_OUTPUT
                echo "branch_available=true" >> $GITHUB_OUTPUT
                BRANCH_AVAILABLE=true
                break
              fi
              
              if [[ $ATTEMPT -lt $MAX_ATTEMPTS ]]; then
                echo "⏳ Attempt $ATTEMPT/$MAX_ATTEMPTS - Branch analysis not yet available, waiting 5s..."
                sleep 5
              fi
            done
          fi

          if [[ "$BRANCH_AVAILABLE" != "true" ]]; then
            echo "⚠️  Branch analysis not found. Using project dashboard."
            ANALYSIS_URL="${SONAR_URL}dashboard?id=${PROJECT_KEY}"
            echo "analysis_url=$ANALYSIS_URL" >> $GITHUB_OUTPUT
            echo "branch_available=false" >> $GITHUB_OUTPUT
          fi

          echo "📊 Analysis URL: $ANALYSIS_URL"

      - name: Check Quality Gate
        id: quality_gate
        run: |
          set -e
          ENCODED_TOKEN=$(echo -n '${{ env.SHARED_USER_TOKEN }}:' | base64)
          PR_NUMBER="${{ github.event.pull_request.number }}"
          BRANCH_NAME="${{ github.head_ref }}"
          BASE_BRANCH="${{ github.base_ref }}"
          PROJECT_KEY="${{ env.SONAR_BACKEND_PROJECT_KEY }}"
          SONAR_URL="${{ env.SONAR_HOST_URL }}"
          ANALYSIS_URL="${{ steps.verify_branch.outputs.analysis_url }}"
          BRANCH_AVAILABLE="${{ steps.verify_branch.outputs.branch_available }}"

          if [[ "$BRANCH_AVAILABLE" == "true" ]] && [[ -n "$BRANCH_NAME" ]]; then
            echo "🌿 Using branch analysis: $BRANCH_NAME"
            API_URL="${SONAR_URL}api/qualitygates/project_status?projectKey=${PROJECT_KEY}&branch=${BRANCH_NAME}"
          else
            echo "📊 Using project analysis"
            API_URL="${SONAR_URL}api/qualitygates/project_status?projectKey=${PROJECT_KEY}"
          fi

          echo "🔍 Checking Quality Gate..."
          echo "API URL: $API_URL"

          MAX_RETRIES=3
          RETRY=0
          status="ERROR"

          while [[ $RETRY -lt $MAX_RETRIES ]]; do
            response=$(wget --header="Authorization: Basic $ENCODED_TOKEN" -q -O - "$API_URL" 2>&1 || echo '{"projectStatus":{"status":"ERROR"}}')
            
            if echo "$response" | jq -e '.projectStatus' > /dev/null 2>&1; then
              status=$(echo "$response" | jq -r '.projectStatus.status // "ERROR"')
              break
            fi
            
            RETRY=$((RETRY + 1))
            if [[ $RETRY -lt $MAX_RETRIES ]]; then
              echo "⚠️  Retry $RETRY/$MAX_RETRIES - Waiting 5s before retry..."
              sleep 5
            fi
          done

          echo "Quality Gate Status: $status"
          echo "Analysis URL: $ANALYSIS_URL"

          if [[ "$status" == "OK" ]]; then
            echo "✅ Quality Gate passed. View analysis: $ANALYSIS_URL"
          elif [[ "$status" == "ERROR" ]] || [[ "$status" == "PENDING" ]]; then
            echo "❌ Could not retrieve Quality Gate status or analysis still processing."
            echo "📊 View analysis report: $ANALYSIS_URL"
            echo "ℹ️  Note: Analysis may take a few minutes to be available. Check the dashboard for latest status."
            echo ""
            echo "🔍 Checking for issues in changed files..."
            ISSUES_URL="${SONAR_URL}api/issues/search?projectKey=${PROJECT_KEY}&branch=${BRANCH_NAME}&resolved=false"
            issues_response=$(wget --header="Authorization: Basic $ENCODED_TOKEN" -q -O - "$ISSUES_URL" 2>&1 || echo '{"issues":[]}')
            issues_count=$(echo "$issues_response" | jq '.issues | length')
            if [[ "$issues_count" -gt 0 ]]; then
              echo "❌ Found $issues_count issues. Please fix them before merging."
              echo "$issues_response" | jq '.issues[]? | {severity, message, component, line}'
              exit 1
            fi
            exit 1
          else
            echo "❌ Quality Gate Status is not OK: $status"
            echo "📊 View full analysis report: $ANALYSIS_URL"
            echo ""
            echo "Failed Quality Gate Conditions Details:"
            conditions_response=$(echo "$response" | jq '.projectStatus.conditions[]? | select(.status != "OK") | {metricKey, comparator, errorThreshold, actualValue}')
            echo "$conditions_response"
            echo ""
            echo "🔍 Issues found:"
            ISSUES_URL="${SONAR_URL}api/issues/search?projectKey=${PROJECT_KEY}&branch=${BRANCH_NAME}&resolved=false"
            issues_response=$(wget --header="Authorization: Basic $ENCODED_TOKEN" -q -O - "$ISSUES_URL" 2>&1 || echo '{"issues":[]}')
            echo "$issues_response" | jq '.issues[]? | {severity, message, component, line}'
            echo ""
            echo "🔗 Full Analysis Report: $ANALYSIS_URL"
            exit 1
          fi

      - name: Check Maintainability
        run: |
          set -e
          ENCODED_TOKEN=$(echo -n '${{ env.SHARED_USER_TOKEN }}:' | base64)
          PR_NUMBER="${{ github.event.pull_request.number }}"
          BRANCH_NAME="${{ github.head_ref }}"
          PROJECT_KEY="${{ env.SONAR_BACKEND_PROJECT_KEY }}"
          SONAR_URL="${{ env.SONAR_HOST_URL }}"
          ANALYSIS_URL="${{ steps.verify_branch.outputs.analysis_url }}"
          BRANCH_AVAILABLE="${{ steps.verify_branch.outputs.branch_available }}"

          if [[ "$BRANCH_AVAILABLE" == "true" ]] && [[ -n "$BRANCH_NAME" ]]; then
            API_URL="${SONAR_URL}api/measures/component?component=${PROJECT_KEY}&branch=${BRANCH_NAME}&metricKeys=sqale_index"
          else
            API_URL="${SONAR_URL}api/measures/component?component=${PROJECT_KEY}&metricKeys=sqale_index"
          fi

          echo "🔍 Checking Technical Debt..."
          response=$(wget --header="Authorization: Basic $ENCODED_TOKEN" -q -O - "$API_URL" 2>&1 || echo '{"component":{"measures":[]}}')
          debt_value=$(echo "$response" | jq -r '.component.measures[0].value // "not_available"')

          echo "Technical Debt: $debt_value minutes"
          if [[ "$debt_value" == "not_available" ]] || [[ "$debt_value" == "null" ]]; then
            echo "⚠️  Technical debt data not available. Continuing with the build."
            set +e
          elif [[ "$debt_value" != "0" ]]; then
            echo "❌ Technical debt is not zero, it's $debt_value minutes. Failing the build."
            echo "📊 View full analysis report: $ANALYSIS_URL"
            
            if [[ "$BRANCH_AVAILABLE" == "true" ]] && [[ -n "$BRANCH_NAME" ]]; then
              ISSUES_URL="${SONAR_URL}api/issues/search?componentKeys=${PROJECT_KEY}&branch=${BRANCH_NAME}"
            else
              ISSUES_URL="${SONAR_URL}api/issues/search?componentKeys=${PROJECT_KEY}"
            fi
            
            issues_response=$(wget --header="Authorization: Basic $ENCODED_TOKEN" -q -O - "$ISSUES_URL" 2>&1 || echo '{"issues":[]}')
            echo "Issues details:"
            echo "$issues_response" | jq '.issues[]? | {key, message, severity, type, component, line}'
            echo ""
            echo "🔗 Full Analysis Report: $ANALYSIS_URL"
            exit 1
          else
            echo "✅ Technical debt is zero. Proceeding with the build."
          fi

      - name: Check Security Hotspots
        run: |
          set -e
          ENCODED_TOKEN=$(echo -n '${{ env.SHARED_USER_TOKEN }}:' | base64)
          PR_NUMBER="${{ github.event.pull_request.number }}"
          BRANCH_NAME="${{ github.head_ref }}"
          PROJECT_KEY="${{ env.SONAR_BACKEND_PROJECT_KEY }}"
          SONAR_URL="${{ env.SONAR_HOST_URL }}"
          ANALYSIS_URL="${{ steps.verify_branch.outputs.analysis_url }}"
          BRANCH_AVAILABLE="${{ steps.verify_branch.outputs.branch_available }}"

          if [[ "$BRANCH_AVAILABLE" == "true" ]] && [[ -n "$BRANCH_NAME" ]]; then
            API_URL="${SONAR_URL}api/measures/component?component=${PROJECT_KEY}&branch=${BRANCH_NAME}&metricKeys=security_hotspots_reviewed"
            HOTSPOTS_URL="${SONAR_URL}api/hotspots/search?projectKey=${PROJECT_KEY}&branch=${BRANCH_NAME}&statuses=TO_REVIEW"
          else
            API_URL="${SONAR_URL}api/measures/component?component=${PROJECT_KEY}&metricKeys=security_hotspots_reviewed"
            HOTSPOTS_URL="${SONAR_URL}api/hotspots/search?projectKey=${PROJECT_KEY}&statuses=TO_REVIEW"
          fi

          echo "🔍 Checking Security Hotspots..."
          response=$(wget --header="Authorization: Basic $ENCODED_TOKEN" -q -O - "$API_URL" 2>&1 || echo '{"component":{"measures":[]}}')
          reviewed_value=$(echo "$response" | jq -r '.component.measures[0].value // "not_available"')

          echo "Security Hotspots Reviewed: $reviewed_value%"
          if [[ "$reviewed_value" == "not_available" ]] || [[ "$reviewed_value" == "null" ]]; then
            echo "⚠️  Security hotspots data not available or no security hotspots to review. Continuing with the build."
            set +e
          elif [[ "$reviewed_value" != "100" ]]; then
            echo "❌ Not all security hotspots have been reviewed. Reviewed: $reviewed_value%. Failing the build."
            echo "📊 View full analysis report: $ANALYSIS_URL"
            
            hotspots_response=$(wget --header="Authorization: Basic $ENCODED_TOKEN" -q -O - "$HOTSPOTS_URL" 2>&1 || echo '{"hotspots":[]}')
            echo "Unresolved Security Hotspots Details:"
            echo "$hotspots_response" | jq '.hotspots[]? | {key, message, component, line, status}'
            echo ""
            echo "🔗 Full Analysis Report: $ANALYSIS_URL"
            exit 1
          else
            echo "✅ All security hotspots have been reviewed. Proceeding with the build."
          fi

      - name: Display SonarQube Analysis Link
        if: always()
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          BRANCH_NAME="${{ github.head_ref }}"
          BASE_BRANCH="${{ github.base_ref }}"
          ANALYSIS_URL="${{ steps.verify_branch.outputs.analysis_url }}"
          BRANCH_AVAILABLE="${{ steps.verify_branch.outputs.branch_available }}"

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📊 SonarQube Analysis Report"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🔗 Analysis URL: $ANALYSIS_URL"
          if [[ -n "$PR_NUMBER" ]]; then
            echo "📝 Pull Request: #$PR_NUMBER"
          fi
          if [[ -n "$BRANCH_NAME" ]] && [[ -n "$BASE_BRANCH" ]]; then
            echo "🌿 Branch: $BRANCH_NAME → $BASE_BRANCH"
            if [[ "$BRANCH_AVAILABLE" == "true" ]]; then
              echo "ℹ️  Using branch analysis (SonarQube Community Edition)"
            fi
          fi
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
