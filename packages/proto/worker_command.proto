syntax = "proto3";

package worker_command;

service WorkerCommand {
  rpc CreateWorker(WorkerPayload) returns (WorkerCommandResponse);
  rpc DeleteWorker(WorkerPayload) returns (WorkerCommandResponse);
  rpc RecreateWorker(WorkerPayload) returns (WorkerCommandResponse);
  rpc CleanupWorker(WorkerPayload) returns (WorkerCommandResponse);
  rpc ChangeConnectionStatus(ChangeConnectionStatusRequest) returns (WorkerCommandResponse);
  rpc NotifyWorkerStatus(NotifyWorkerStatusRequest) returns (WorkerCommandResponse);
  rpc RequestWorkerSelfHealing(WorkerSelfHealingRequest) returns (WorkerCommandResponse);
  rpc ResolveIncomingCallAction(ResolveIncomingCallActionRequest) returns (ResolveIncomingCallActionResponse);
  rpc GetTypingSimulationConfig(GetTypingSimulationConfigRequest) returns (GetTypingSimulationConfigResponse);
  rpc RegisterS3BackupFallbackUpload(RegisterS3BackupFallbackUploadRequest) returns (WorkerCommandResponse);
  rpc ValidatePhone(PhoneValidationRequest) returns (PhoneValidationResponse);
  rpc CreateWarmWorker(CreateWarmWorkerRequest) returns (WarmWorkerCommandResponse);
  rpc DeleteWarmWorker(DeleteWarmWorkerRequest) returns (WorkerCommandResponse);
  rpc ActivateWarmWorker(ActivateWarmWorkerRequest) returns (WarmWorkerCommandResponse);
}

message WorkerPayload {
  string action = 1;
  string worker_id = 2;
  string server_id = 3;
  string account_id = 4;
  string worker_status_id = 5;
  string worker_type_id = 6;
  string name = 7;
  string previous_worker_status_id = 8;
  bool remove_session = 9;
  bool remove_volume = 10;
  string lifecycle_operation_id = 11;
  string previous_worker_type_id = 12;
  string debug_trace_id = 13;
}

message ChangeConnectionStatusRequest {
  reserved 13, 14;

  string worker_id = 1;
  string account_id = 2;
  string status = 3;
  string type = 4;
  string phone_connection = 5;
  bool remove_session = 6;
  string connection_attempt_id = 7;
  bool qr_pending = 8;
  string proxy_status = 9;
  string proxy_error_code = 10;
  string proxy_fallback = 11;
  bool proxy_bypassed = 12;
  int32 runtime_generation = 15;
  string warm_pool_id = 16;
  string debug_trace_id = 17;
}

message NotifyWorkerStatusRequest {
  reserved 22;

  string worker_id = 1;
  string account_id = 2;
  string worker_status_id = 3;
  string phone = 4;
  bool disconnected_user = 5;
  string connection_attempt_id = 6;
  int32 code = 7;
  string status = 8;
  string qrcode = 9;
  bool is_new_login = 10;
  int64 time = 11;
  string pairing_code = 12;
  int32 seconds_until_next_attempt = 13;
  int32 attempt = 14;
  int32 max_attempts = 15;
  bool qr_pending = 16;
  string proxy_status = 17;
  string proxy_error_code = 18;
  string proxy_fallback = 19;
  bool proxy_bypassed = 20;
  string qr_generated_at = 21;
  string reason = 23;
  string error = 24;
  int32 time_to_first_qr_ms = 25;
  string container_id = 26;
  int32 runtime_generation = 27;
  string warm_pool_id = 28;
  string debug_trace_id = 29;
  bool session_ready = 30;
  bool can_send = 31;
  bool can_receive_runtime = 32;
  bool authenticated = 33;
  string provider_state = 34;
  string degraded_reason = 35;
  string last_probe_at = 36;
  int32 probe_latency_ms = 37;
  string worker_type_id = 38;
}

message WorkerSelfHealingRequest {
  string worker_id = 1;
  string account_id = 2;
  string worker_type_id = 3;
  string source = 4;
  string reason = 5;
  string provider_state = 6;
  string degraded_reason = 7;
  bool kafka_unhealthy = 8;
  int32 runtime_generation = 9;
  string debug_trace_id = 10;
  int32 recovery_window_seconds = 11;
}

message ResolveIncomingCallActionRequest {
  string worker_id = 1;
  string account_id = 2;
  string call_jid = 3;
  string call_phone = 4;
  bool is_video = 5;
}

message ResolveIncomingCallActionResponse {
  bool reject_call = 1;
  bool show_message_on_call = 2;
  string show_message_text = 3;
}

message GetTypingSimulationConfigRequest {
  string worker_id = 1;
  string account_id = 2;
}

message GetTypingSimulationConfigResponse {
  bool enabled = 1;
  int32 speed = 2;
}

message RegisterS3BackupFallbackUploadRequest {
  string account_id = 1;
  string bucket = 2;
  string object_key = 3;
  string file_name = 4;
  string content_type = 5;
  int64 size_bytes = 6;
  int32 primary_attempts = 7;
  int32 backup_attempts = 8;
  string primary_error = 9;
  string backup_error = 10;
}

message PhoneValidationRequest {
  string request_id = 1;
  string account_id = 2;
  string worker_id = 3;
  string phone = 4;
  string phone_ddi = 5;
}

message PhoneValidationResponse {
  string request_id = 1;
  string account_id = 2;
  string worker_id = 3;
  bool valid = 4;
  string jid = 5;
  string phone = 6;
  string error = 7;
}

message CreateWarmWorkerRequest {
  string request_id = 1;
  string warm_pool_id = 2;
  string server_id = 3;
  string worker_type_id = 4;
}

message DeleteWarmWorkerRequest {
  string request_id = 1;
  string warm_pool_id = 2;
  string server_id = 3;
  string worker_type_id = 4;
  string container_id = 5;
  string container_name = 6;
  string session_volume_name = 7;
  bool remove_volume = 8;
  string reason = 9;
  string worker_id = 10;
  string requested_at = 11;
}

message ActivateWarmWorkerRequest {
  string warm_pool_id = 1;
  string worker_id = 2;
  string account_id = 3;
  string server_id = 4;
  string worker_type_id = 5;
  string lifecycle_operation_id = 6;
  bool remove_session = 7;
  bool remove_volume = 8;
  string previous_worker_type_id = 9;
  string previous_worker_status_id = 10;
  string debug_trace_id = 11;
}

message WarmWorkerCommandResponse {
  string warm_pool_id = 1;
  string worker_id = 2;
  string container_id = 3;
  string container_name = 4;
  string session_volume_name = 5;
  bool claimed = 6;
  bool fallback_created = 7;
  string error = 8;
}

message WorkerCommandResponse {}
