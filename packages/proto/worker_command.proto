syntax = "proto3";

package worker_command;

service WorkerCommand {
  rpc CreateWorker(WorkerPayload) returns (WorkerCommandResponse);
  rpc DeleteWorker(WorkerPayload) returns (WorkerCommandResponse);
  rpc RecreateWorker(WorkerPayload) returns (WorkerCommandResponse);
  rpc CleanupWorker(WorkerPayload) returns (WorkerCommandResponse);
  rpc ChangeConnectionStatus(ChangeConnectionStatusRequest) returns (WorkerCommandResponse);
  rpc NotifyWorkerStatus(NotifyWorkerStatusRequest) returns (WorkerCommandResponse);
  rpc RequestWorkerSelfHealing(WorkerSelfHealingRequest) returns (WorkerCommandResponse);
  rpc ResolveIncomingCallAction(ResolveIncomingCallActionRequest) returns (ResolveIncomingCallActionResponse);
  rpc GetTypingSimulationConfig(GetTypingSimulationConfigRequest) returns (GetTypingSimulationConfigResponse);
  rpc RegisterS3BackupFallbackUpload(RegisterS3BackupFallbackUploadRequest) returns (WorkerCommandResponse);
  rpc ValidatePhone(PhoneValidationRequest) returns (PhoneValidationResponse);
  rpc ImportSecureSession(SecureSessionImportRequest) returns (SecureSessionImportResponse);
  rpc RuntimeHealth(WorkerRuntimeHealthRequest) returns (WorkerRuntimeHealthResponse);
  rpc PrepareSessionStorageMigration(SessionStorageMigrationPrepareRequest) returns (SessionStorageMigrationPrepareResponse);
  rpc DeleteLegacySessionVolume(LegacySessionVolumeDeleteRequest) returns (LegacySessionVolumeDeleteResponse);
  rpc ActivateWhatsappRuntimeFence(WhatsappRuntimeFenceActivationRequest) returns (WhatsappRuntimeFenceActivationResponse);
  rpc AuthorizeChromiumLockCleanup(ChromiumLockCleanupAuthorizationRequest) returns (ChromiumLockCleanupAuthorizationResponse);
  rpc CreateWarmWorker(CreateWarmWorkerRequest) returns (WarmWorkerCommandResponse);
  rpc DeleteWarmWorker(DeleteWarmWorkerRequest) returns (WorkerCommandResponse);
  rpc ActivateWarmWorker(ActivateWarmWorkerRequest) returns (WarmWorkerCommandResponse);
}

message WorkerPayload {
  string action = 1;
  string worker_id = 2;
  string server_id = 3;
  string account_id = 4;
  string worker_status_id = 5;
  string worker_type_id = 6;
  string name = 7;
  string previous_worker_status_id = 8;
  // Presence matters for lifecycle commands: `false` means preserve the
  // PostgreSQL-backed session, while an omitted legacy field keeps backwards
  // compatible defaults. Proto3 scalar defaults cannot express that without
  // `optional` presence.
  optional bool remove_session = 9;
  optional bool remove_volume = 10;
  string lifecycle_operation_id = 11;
  string previous_worker_type_id = 12;
  string debug_trace_id = 13;
  bool recovery_without_journal = 14;
  string expected_container_id = 15;
  string expected_container_started_at = 16;
  int32 expected_container_restart_count = 17;
  string expected_container_health_status = 18;
  bool expected_container_paused = 19;
  int32 expected_runtime_generation = 20;
  string lifecycle_semantic_fingerprint = 21;
  string session_storage = 22;
  // Source storage for an explicit legacy-volume to PostgreSQL reset. The
  // replacement runtime always uses `session_storage`.
  string previous_session_storage = 23;
  // Source server for a provider handoff whose target runs elsewhere.
  string previous_server_id = 24;
  string session_storage_migration_id = 25;
  string legacy_session_volume_name = 26;
  string legacy_session_checksum = 27;
}

message ChangeConnectionStatusRequest {
  reserved 13, 14;

  string worker_id = 1;
  string account_id = 2;
  string status = 3;
  string type = 4;
  string phone_connection = 5;
  bool remove_session = 6;
  string connection_attempt_id = 7;
  bool qr_pending = 8;
  string proxy_status = 9;
  string proxy_error_code = 10;
  string proxy_fallback = 11;
  bool proxy_bypassed = 12;
  int32 runtime_generation = 15;
  string warm_pool_id = 16;
  string debug_trace_id = 17;
  optional string authorized_connection_epoch = 18;
}

message NotifyWorkerStatusRequest {
  reserved 22;

  string worker_id = 1;
  string account_id = 2;
  string worker_status_id = 3;
  string phone = 4;
  bool disconnected_user = 5;
  string connection_attempt_id = 6;
  int32 code = 7;
  string status = 8;
  string qrcode = 9;
  bool is_new_login = 10;
  int64 time = 11;
  string pairing_code = 12;
  int32 seconds_until_next_attempt = 13;
  int32 attempt = 14;
  int32 max_attempts = 15;
  bool qr_pending = 16;
  string proxy_status = 17;
  string proxy_error_code = 18;
  string proxy_fallback = 19;
  bool proxy_bypassed = 20;
  string qr_generated_at = 21;
  string reason = 23;
  string error = 24;
  int32 time_to_first_qr_ms = 25;
  string container_id = 26;
  int32 runtime_generation = 27;
  string warm_pool_id = 28;
  string debug_trace_id = 29;
  bool session_ready = 30;
  bool can_send = 31;
  bool can_receive_runtime = 32;
  bool authenticated = 33;
  string provider_state = 34;
  string degraded_reason = 35;
  string last_probe_at = 36;
  int32 probe_latency_ms = 37;
  string worker_type_id = 38;
  string passkey_public_key = 39;
  bool passkey_pending = 40;
  string passkey_confirmation_code = 41;
  bool passkey_skip_handoff_ux = 42;
  WhatsappConnectionStatus connection_status = 43;
  string connection_status_source_id = 44;
}

message WorkerSelfHealingRequest {
  string worker_id = 1;
  string account_id = 2;
  string worker_type_id = 3;
  string source = 4;
  string reason = 5;
  string provider_state = 6;
  string degraded_reason = 7;
  bool kafka_unhealthy = 8;
  int32 runtime_generation = 9;
  string debug_trace_id = 10;
  int32 recovery_window_seconds = 11;
  bool session_ready = 12;
  bool can_send = 13;
  bool can_receive_runtime = 14;
  bool authenticated = 15;
  string phone = 16;
}

message ResolveIncomingCallActionRequest {
  string worker_id = 1;
  string account_id = 2;
  string call_jid = 3;
  string call_phone = 4;
  bool is_video = 5;
}

message ResolveIncomingCallActionResponse {
  bool reject_call = 1;
  bool show_message_on_call = 2;
  string show_message_text = 3;
}

message GetTypingSimulationConfigRequest {
  string worker_id = 1;
  string account_id = 2;
}

message GetTypingSimulationConfigResponse {
  bool enabled = 1;
  int32 speed = 2;
}

message RegisterS3BackupFallbackUploadRequest {
  string account_id = 1;
  string bucket = 2;
  string object_key = 3;
  string file_name = 4;
  string content_type = 5;
  int64 size_bytes = 6;
  int32 primary_attempts = 7;
  int32 backup_attempts = 8;
  string primary_error = 9;
  string backup_error = 10;
}

message PhoneValidationRequest {
  string request_id = 1;
  string account_id = 2;
  string worker_id = 3;
  string phone = 4;
  string phone_ddi = 5;
}

message PhoneValidationResponse {
  string request_id = 1;
  string account_id = 2;
  string worker_id = 3;
  bool valid = 4;
  string jid = 5;
  string phone = 6;
  string error = 7;
}

message SecureSessionImportRequest {
  string worker_id = 1;
  string account_id = 2;
  string worker_type_id = 3;
  string connection_attempt_id = 4;
  int32 runtime_generation = 5;
  string format_version = 6;
  string source = 7;
  string target_provider = 8;
  string payload_ref = 9;
  string payload_json = 10;
  string checksum = 11;
  string debug_trace_id = 12;
  optional string authorized_connection_epoch = 13;
}

message SecureSessionImportResponse {
  int32 code = 1;
  string status = 2;
  string worker_id = 3;
  string account_id = 4;
  string phone = 5;
  string worker_status_id = 6;
  string connection_attempt_id = 7;
  string reason = 8;
  string error = 9;
  int32 runtime_generation = 10;
  string worker_type_id = 11;
  string debug_trace_id = 12;
  bool session_ready = 13;
  bool can_send = 14;
  bool can_receive_runtime = 15;
  bool authenticated = 16;
  string provider_state = 17;
  string degraded_reason = 18;
  string last_probe_at = 19;
  int32 probe_latency_ms = 20;
}

message WorkerRuntimeHealthRequest {
  string worker_id = 1;
  string warm_pool_id = 2;
  string worker_type_id = 3;
  string server_id = 4;
}

message WorkerRuntimeHealthResponse {
  string worker_id = 1;
  string account_id = 2;
  string warm_pool_id = 3;
  bool standby = 4;
  bool activated = 5;
  bool ready = 6;
  bool has_session = 7;
  bool has_qr = 8;
  string error = 9;
  string worker_type_id = 10;
  int32 runtime_generation = 11;
  string runtime_state = 12;
  bool qr_stream_ready = 13;
  bool session_ready = 14;
  bool can_send = 15;
  bool can_receive_runtime = 16;
  bool authenticated = 17;
  string provider_state = 18;
  string degraded_reason = 19;
  string last_probe_at = 20;
  int32 probe_latency_ms = 21;
  string phone = 22;
  bool kafka_unhealthy = 23;
  bool kafka_consumers_ready = 24;
  bool kafka_consumers_authorized = 25;
  uint32 runtime_health_schema_version = 26;
  WhatsappConnectionStatus connection_status = 27;
  string connection_status_source_id = 28;
  bool command_ingress_ready = 29;
  bool command_ingress_authorized = 30;
  string session_storage = 31;
  string session_revision_id = 32;
  string session_storage_migration_id = 33;
}

message SessionStorageMigrationPrepareRequest {
  string migration_id = 1;
  string worker_id = 2;
  string account_id = 3;
  string provider = 4;
  int32 runtime_generation = 5;
  string runtime_capability = 6;
  string legacy_volume_name = 7;
  string expected_phone = 8;
}

message SessionStorageMigrationPrepareResponse {
  string migration_id = 1;
  string worker_id = 2;
  string provider = 3;
  int32 runtime_generation = 4;
  bool prepared = 5;
  bool consumers_drained = 6;
  bool writes_paused = 7;
  bool checkpoint_persisted = 8;
  bool provider_disconnected = 9;
  bool volume_preserved = 10;
  string checkpoint_checksum_sha256 = 11;
  int64 checkpoint_size_bytes = 12;
  int64 checkpoint_record_count = 13;
  string phone = 14;
  string identity_hash_sha256 = 15;
  string prepared_at = 16;
  string error = 17;
}

message LegacySessionVolumeDeleteRequest {
  string worker_id = 1;
  string account_id = 2;
  string migration_id = 3;
  string volume_name = 4;
}

message LegacySessionVolumeDeleteResponse {
  string worker_id = 1;
  string migration_id = 2;
  bool volume_absent = 3;
  int32 mounted_container_count = 4;
}

message WhatsappConnectionStatus {
  string provider = 1;
  string status = 2;
  bool connected = 3;
  bool authenticated = 4;
  optional bool sessionValid = 5;
  bool recoverable = 6;
  bool qrAvailable = 7;
  uint64 sequence = 8;
  string changedAt = 9;
  string reason = 10;
  string errorCode = 11;
}

message WhatsappRuntimeFenceActivationRequest {
  string worker_id = 1;
  string account_id = 2;
  string source_provider = 3;
  int32 runtime_generation = 4;
  string connection_epoch = 5;
  optional string connection_attempt_id = 6;
}

message WhatsappRuntimeFenceActivationResponse {
  bool activated = 1;
  bool already_active = 2;
  int64 connection_sequence = 3;
}

message ChromiumLockCleanupAuthorizationRequest {
  string request_id = 1;
  string worker_id = 2;
  string account_id = 3;
  string worker_type_id = 4;
  int32 runtime_generation = 5;
  string requester_container_id = 6;
  string session_volume_name = 7;
  string singleton_lock_target = 8;
}

message ChromiumLockCleanupAuthorizationResponse {
  bool authorized = 1;
  string reason = 2;
  string request_id = 3;
  string requester_container_id = 4;
  string owner_container_id = 5;
  string session_volume_name = 6;
  string singleton_lock_target = 7;
  int64 expires_at_unix_ms = 8;
}

message CreateWarmWorkerRequest {
  string request_id = 1;
  string warm_pool_id = 2;
  string server_id = 3;
  string worker_type_id = 4;
}

message DeleteWarmWorkerRequest {
  string request_id = 1;
  string warm_pool_id = 2;
  string server_id = 3;
  string worker_type_id = 4;
  string container_id = 5;
  string container_name = 6;
  string session_volume_name = 7;
  bool remove_volume = 8;
  string reason = 9;
  string worker_id = 10;
  string requested_at = 11;
}

message ActivateWarmWorkerRequest {
  string warm_pool_id = 1;
  string worker_id = 2;
  string account_id = 3;
  string server_id = 4;
  string worker_type_id = 5;
  string lifecycle_operation_id = 6;
  bool remove_session = 7;
  bool remove_volume = 8;
  string previous_worker_type_id = 9;
  string previous_worker_status_id = 10;
  string debug_trace_id = 11;
  string lifecycle_semantic_fingerprint = 12;
  string session_storage = 13;
}

message WarmWorkerCommandResponse {
  string warm_pool_id = 1;
  string worker_id = 2;
  string container_id = 3;
  string container_name = 4;
  string session_volume_name = 5;
  bool claimed = 6;
  bool fallback_created = 7;
  string error = 8;
}

message WorkerCommandResponse {}
