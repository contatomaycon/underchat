syntax = "proto3";

package worker_connection;

service WorkerConnection {
  rpc RequestConnection(StatusConnectionRequest) returns (WorkerConnectionResponse);
  rpc SendPasskeyResponse(PasskeyResponseRequest) returns (WorkerConnectionResponse);
  rpc ConfirmPasskey(PasskeyConfirmationRequest) returns (WorkerConnectionResponse);
  rpc ImportSecureSession(SecureSessionImportRequest) returns (WorkerConnectionResponse);
  rpc ValidatePhone(PhoneValidationRequest) returns (PhoneValidationResponse);
  rpc ActivateRuntime(WorkerRuntimeActivationRequest) returns (WorkerRuntimeActivationResponse);
  rpc RuntimeHealth(WorkerRuntimeHealthRequest) returns (WorkerRuntimeHealthResponse);
  rpc PrepareProviderHandoff(ProviderHandoffPrepareRequest) returns (ProviderHandoffPrepareResponse);
  rpc PrepareSessionStorageMigration(SessionStorageMigrationPrepareRequest) returns (SessionStorageMigrationPrepareResponse);
}

message SessionStorageMigrationPrepareRequest {
  string worker_id = 1;
  string account_id = 2;
  string migration_id = 3;
  string provider = 4;
  string source_volume_name = 5;
  int32 runtime_generation = 6;
  string expected_phone = 7;
  string debug_trace_id = 8;
  string runtime_capability = 9;
}

message SessionStorageMigrationPrepareResponse {
  string worker_id = 1;
  string provider = 2;
  string migration_id = 3;
  int32 runtime_generation = 4;
  bool prepared = 5;
  bool consumers_drained = 6;
  bool writes_paused = 7;
  bool checkpoint_persisted = 8;
  bool provider_disconnected = 9;
  string checkpoint_checksum_sha256 = 10;
  int64 checkpoint_size_bytes = 11;
  int64 checkpoint_record_count = 12;
  string phone = 13;
  string identity_hash = 14;
  string prepared_at = 15;
  string error = 16;
  bool volume_preserved = 17;
}

message ProviderHandoffPrepareRequest {
  string worker_id = 1;
  string account_id = 2;
  string handoff_id = 3;
  string lifecycle_operation_id = 4;
  string source_provider = 5;
  string target_provider = 6;
  int64 source_revision_id = 7;
  int32 runtime_generation = 8;
  string debug_trace_id = 9;
}

message ProviderHandoffPrepareResponse {
  string worker_id = 1;
  string provider = 2;
  string handoff_id = 3;
  string lifecycle_operation_id = 4;
  int64 source_revision_id = 5;
  int32 runtime_generation = 6;
  bool prepared = 7;
  bool consumers_drained = 8;
  bool writes_paused = 9;
  bool checkpoint_persisted = 10;
  bool provider_disconnected = 11;
  bool lease_released = 12;
  string checkpoint_checksum_sha256 = 13;
  int64 checkpoint_size_bytes = 14;
  int64 checkpoint_record_count = 15;
  string prepared_at = 16;
  string error = 17;
}

message StatusConnectionRequest {
  reserved 7, 8;

  string worker_id = 1;
  string status = 2;
  string type = 3;
  string phone_connection = 4;
  bool remove_session = 5;
  string connection_attempt_id = 6;
  int32 runtime_generation = 9;
  string warm_pool_id = 10;
  string debug_trace_id = 11;
  bool qr_pending = 12;
  optional string authorized_connection_epoch = 13;
}

message WorkerConnectionResponse {
  reserved 22;

  int32 code = 1;
  string status = 2;
  string worker_id = 3;
  string account_id = 4;
  string qrcode = 5;
  bool is_new_login = 6;
  int64 time = 7;
  string phone = 8;
  bool disconnected_user = 9;
  string pairing_code = 10;
  int32 seconds_until_next_attempt = 11;
  string worker_status_id = 12;
  int32 attempt = 13;
  int32 max_attempts = 14;
  string connection_attempt_id = 15;
  bool qr_pending = 16;
  string proxy_status = 17;
  string proxy_error_code = 18;
  string proxy_fallback = 19;
  bool proxy_bypassed = 20;
  string qr_generated_at = 21;
  string reason = 23;
  string error = 24;
  int32 time_to_first_qr_ms = 25;
  string container_id = 26;
  int32 runtime_generation = 27;
  string warm_pool_id = 28;
  string worker_type_id = 29;
  string expires_at = 30;
  string debug_trace_id = 31;
  bool session_ready = 32;
  bool can_send = 33;
  bool can_receive_runtime = 34;
  bool authenticated = 35;
  string provider_state = 36;
  string degraded_reason = 37;
  string last_probe_at = 38;
  int32 probe_latency_ms = 39;
  string passkey_public_key = 40;
  bool passkey_pending = 41;
  string passkey_confirmation_code = 42;
  bool passkey_skip_handoff_ux = 43;
  WhatsappConnectionStatus connection_status = 44;
  string connection_status_source_id = 45;
  optional string authorized_connection_epoch = 46;
}

message PasskeyResponseRequest {
  string worker_id = 1;
  string account_id = 2;
  string connection_attempt_id = 3;
  string passkey_response = 4;
  string debug_trace_id = 5;
}

message PasskeyConfirmationRequest {
  string worker_id = 1;
  string account_id = 2;
  string connection_attempt_id = 3;
  string debug_trace_id = 4;
}

message SecureSessionImportRequest {
  string worker_id = 1;
  string account_id = 2;
  string worker_type_id = 3;
  string connection_attempt_id = 4;
  int32 runtime_generation = 5;
  string format_version = 6;
  string source = 7;
  string target_provider = 8;
  string payload_ref = 9;
  string payload_json = 10;
  string checksum = 11;
  string debug_trace_id = 12;
  optional string authorized_connection_epoch = 13;
}

message PhoneValidationRequest {
  string request_id = 1;
  string account_id = 2;
  string worker_id = 3;
  string phone = 4;
  string phone_ddi = 5;
}

message PhoneValidationResponse {
  string request_id = 1;
  string account_id = 2;
  string worker_id = 3;
  bool valid = 4;
  string jid = 5;
  string phone = 6;
  string error = 7;
}

message WorkerRuntimeActivationRequest {
  reserved 8, 13;

  string worker_id = 1;
  string account_id = 2;
  string worker_type_id = 3;
  string warm_pool_id = 4;
  string session_volume_name = 5;
  string balancer_grpc_host = 6;
  int32 balancer_grpc_port = 7;
  int32 runtime_generation = 9;
  string session_storage = 10;
  string runtime_capability = 11;
  string writer_epoch = 12;
}

message WorkerRuntimeActivationResponse {
  string worker_id = 1;
  string account_id = 2;
  bool activated = 3;
  bool already_active = 4;
  string error = 5;
}

message WorkerRuntimeHealthRequest {
  string worker_id = 1;
  string warm_pool_id = 2;
}

message WorkerRuntimeHealthResponse {
  string worker_id = 1;
  string account_id = 2;
  string warm_pool_id = 3;
  bool standby = 4;
  bool activated = 5;
  bool ready = 6;
  bool has_session = 7;
  bool has_qr = 8;
  string error = 9;
  string worker_type_id = 10;
  int32 runtime_generation = 11;
  string runtime_state = 12;
  bool qr_stream_ready = 13;
  bool session_ready = 14;
  bool can_send = 15;
  bool can_receive_runtime = 16;
  bool authenticated = 17;
  string provider_state = 18;
  string degraded_reason = 19;
  string last_probe_at = 20;
  int32 probe_latency_ms = 21;
  string phone = 22;
  bool kafka_unhealthy = 23;
  bool kafka_consumers_ready = 24;
  bool kafka_consumers_authorized = 25;
  uint32 runtime_health_schema_version = 26;
  WhatsappConnectionStatus connection_status = 27;
  string connection_status_source_id = 28;
  bool command_ingress_ready = 29;
  bool command_ingress_authorized = 30;
  string session_storage = 31;
  int64 session_revision_id = 32;
  string session_storage_migration_id = 33;
}

message WhatsappConnectionStatus {
  string provider = 1;
  string status = 2;
  bool connected = 3;
  bool authenticated = 4;
  optional bool sessionValid = 5;
  bool recoverable = 6;
  bool qrAvailable = 7;
  uint64 sequence = 8;
  string changedAt = 9;
  string reason = 10;
  string errorCode = 11;
}
