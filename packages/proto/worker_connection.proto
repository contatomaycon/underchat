syntax = "proto3";

package worker_connection;

service WorkerConnection {
  rpc RequestConnection(StatusConnectionRequest) returns (WorkerConnectionResponse);
  rpc ValidatePhone(PhoneValidationRequest) returns (PhoneValidationResponse);
}

message StatusConnectionRequest {
  string worker_id = 1;
  string status = 2;
  string type = 3;
  string phone_connection = 4;
  bool remove_session = 5;
  string connection_attempt_id = 6;
}

message WorkerConnectionResponse {
  int32 code = 1;
  string status = 2;
  string worker_id = 3;
  string account_id = 4;
  string qrcode = 5;
  bool is_new_login = 6;
  int64 time = 7;
  string phone = 8;
  bool disconnected_user = 9;
  string pairing_code = 10;
  int32 seconds_until_next_attempt = 11;
  string worker_status_id = 12;
  int32 attempt = 13;
  int32 max_attempts = 14;
  string connection_attempt_id = 15;
  bool qr_pending = 16;
}

message PhoneValidationRequest {
  string request_id = 1;
  string account_id = 2;
  string worker_id = 3;
  string phone = 4;
  string phone_ddi = 5;
}

message PhoneValidationResponse {
  string request_id = 1;
  string account_id = 2;
  string worker_id = 3;
  bool valid = 4;
  string jid = 5;
  string phone = 6;
  string error = 7;
}
